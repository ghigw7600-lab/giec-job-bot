<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GIEC JOB 관리</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #16181d);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --link: var(--tg-theme-link-color, #2a6fdb);
    --btn: var(--tg-theme-button-color, #2a6fdb);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--hint) 25%, transparent);
    --ok: #1f9d55; --no: #d64545; --warn: #d98a00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; background: var(--bg2); color: var(--text); padding-bottom: 72px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 14px 0; }
  header h1 { margin: 0 0 8px; font-size: 17px; }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav button { flex: 1; min-width: 70px; border: 0; background: none; color: var(--hint); padding: 9px 4px 10px; font-size: 14px; border-bottom: 2px solid transparent; }
  nav button.on { color: var(--text); border-color: var(--btn); font-weight: 600; }
  main { padding: 12px; max-width: 720px; margin: 0 auto; }
  .card { background: var(--bg); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .sp { flex: 1; min-width: 0; }
  .muted { color: var(--hint); font-size: 13px; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--bg2); color: var(--hint); white-space: nowrap; }
  .pill.urgent { background: #ffe6e6; color: #c0392b; }
  .pill.open { background: #e5f6ec; color: var(--ok); }
  .pill.closed { background: var(--bg2); color: var(--hint); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
  .chip { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .chip.on { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .btn { border: 0; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600; background: var(--btn); color: var(--btn-text); }
  .btn.ghost { background: var(--bg2); color: var(--text); }
  .btn.red { background: #fdeaea; color: var(--no); }
  .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .4; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  input, textarea, select { width: 100%; font: inherit; color: var(--text); background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 130px; resize: vertical; }
  label.f { display: block; font-size: 13px; color: var(--hint); margin: 12px 0 6px; }
  .pre { white-space: pre-wrap; background: var(--bg2); border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 14px; }
  .stat { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat .card { margin: 0; }
  [data-s] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .stat b { display: block; font-size: 24px; }
  .att { flex: 1; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; border: 1.5px solid var(--line); background: var(--bg); color: var(--text); }
  .att.ok.on { background: #e5f6ec; border-color: var(--ok); color: #13723f; }
  .att.no.on { background: #fdeaea; border-color: var(--no); color: var(--no); }
  .grp { font-size: 12px; color: var(--hint, #8a9099); margin: 10px 0 4px; }
  a { color: var(--link); text-decoration: none; }
  .empty { text-align: center; color: var(--hint); padding: 40px 10px; }
  .back { border: 0; background: none; color: var(--link); font-size: 15px; padding: 0 0 10px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 90%; }
  .toast.show { opacity: .95; }
  .skel { height: 64px; border-radius: 12px; background: linear-gradient(90deg, var(--bg) 0%, var(--bg2) 50%, var(--bg) 100%); background-size: 200% 100%; animation: sh 1.2s infinite; margin-bottom: 10px; }
  @keyframes sh { to { background-position: -200% 0; } }
  .hist { font-size: 13px; margin: 2px 0; }
  .count { font-size: 14px; margin: 10px 0; padding: 10px 12px; border-radius: 10px; background: var(--bg2); }
</style>
</head>
<body>
<header>
  <h1>🛠 GIEC JOB 관리</h1>
  <nav id="tabs">
    <button data-t="jobs" class="on">📋 공고</button>
    <button data-t="new">✍️ 새 공고</button>
    <button data-t="stats">📊 현황</button>
    <button data-t="students">👥 학생</button>
  </nav>
</header>
<main id="view"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); };
const haptic = () => tg?.HapticFeedback?.impactOccurred?.("light");

async function api(action, args = {}) {
  const r = await fetch("/api/mini", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ area: "admin", action, initData: tg?.initData ?? "", ...args }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "오류");
  return j;
}

const STATUS = { new: "🆕 신규", contacted: "🟡 연락완료", introduced: "🟢 연결완료", closed: "⚫ 종결" }; // 종결 버튼은 없앰(11-04), 예전 값 표시용
const badge = (s) => (s.workNo >= 2 ? "⚠️" : s.workOk >= 3 && !s.workNo ? "⭐" : "");
const ago = (ts) => { if (!ts) return ""; const m = Math.round((Date.now() - ts) / 60000); return m < 60 ? `${m}분 전` : m < 1440 ? `${Math.round(m / 60)}시간 전` : `${Math.round(m / 1440)}일 전`; };
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const kst = (off) => { const d = new Date(Date.now() + 9 * 3600e3 + off * 864e5); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${WD[d.getUTCDay()]})`; };

let DATA = null;
let tab = "jobs";
let jobFilter = "open";
let stuQ = "", stuF = {};
const NEW = { kind: "urgent", off: 0, where: "g", topik: 0, car: false, gender: "", noFlaky: false, text: "", slots: "", noInfo: 1, raw: false };
// 공고 양식 칸 (11-04 혜승: 누르고 빈칸에 타이핑) → 양식 글로 자동 조립
const DAYS = ["월", "화", "수", "목", "금", "토", "일"];
const F = { title: "", task: "", sex: "", count: "", addr: "", days: [], dates: [], startDate: "", wdS: "", wdE: "", weS: "", weE: "", wdPay: "", wePay: "", payType: "", payDay: "" };
// 시간제 근무 날짜 (달력에서 여러 날 고름, "2026-11-05")
const todayISO = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const isoDay = (iso) => { const d = new Date(iso + "T00:00:00Z"); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${WD[d.getUTCDay()]})`; };
const isoOff = (iso) => Math.round((Date.parse(iso + "T00:00:00Z") - Date.parse(todayISO() + "T00:00:00Z")) / 864e5);
const won = (v) => { const n = String(v ?? "").replace(/[^\d]/g, ""); return n ? Number(n).toLocaleString("ko-KR") + "원" : ""; };
function composeJob() {
  const d = [...F.days].sort((a, b) => a - b);
  const wd = d.filter((x) => x < 5), we = d.filter((x) => x >= 5);
  const name = (xs) => xs.map((x) => DAYS[x] + "요일").join(" · ");
  const off = DAYS.map((_, i) => i).filter((i) => !d.includes(i));
  const time = (s, e) => (s || e ? `${s || "?"} ~ ${e || "?"}` : "");
  const L = [];
  L.push(`📢 [GIEC JOB] ${F.title.trim() || "(제목)"} 모집!`);
  if (F.task.trim()) L.push(`🧺 업무: ${F.task.trim()}`);
  if (F.count) L.push(`${F.sex === "여성" ? "👩" : F.sex === "남성" ? "👨" : "👥"} 모집인원: ${F.sex ? F.sex + " " : ""}${F.count}명`);
  if (F.addr.trim()) L.push("📍 근무 위치", F.addr.trim());
  L.push("━━━━━━━━━━━━━━", "⏰ 근무 조건");
  if (F.payType === "시간제") {
    const ds = [...(F.dates ?? [])].sort();
    if (ds.length) L.push(`📅 근무일: ${ds.map(isoDay).join(" · ")}${ds.length > 1 ? ` (총 ${ds.length}일)` : ""}`);
    if (time(F.wdS, F.wdE)) L.push(`🕘 근무시간: ${time(F.wdS, F.wdE)}`);
    L.push("━━━━━━━━━━━━━━", "💰 급여 조건");
    if (F.wdPay) L.push(`시급: ${won(F.wdPay)}`);
    L.push("급여 방식: 시간제");
    if (F.payDay.trim()) L.push(`급여 지급일: ${F.payDay.trim()}`);
    return L.join("\n");
  }
  if (d.length) { L.push(`📅 근무요일: 주 ${d.length}일`, name(d)); if (off.length) L.push(`휴무: ${name(off)}`); }
  if (wd.length && time(F.wdS, F.wdE)) L.push("🕘 평일 근무시간", `${name(wd)}: ${time(F.wdS, F.wdE)}`);
  if (we.length && time(F.weS, F.weE)) L.push("🕙 주말 근무시간", `${name(we)}: ${time(F.weS, F.weE)}`);
  if (!d.length && time(F.wdS, F.wdE)) L.push(`🕘 근무시간: ${time(F.wdS, F.wdE)}`);
  L.push("━━━━━━━━━━━━━━", "💰 급여 조건");
  const both = wd.length && we.length;
  if (F.payType === "월급제") { if (F.wdPay) L.push(`월급: ${won(F.wdPay)}`); }
  else {
    if (F.wdPay) L.push(`${both ? "평일 " : ""}시급: ${won(F.wdPay)}`);
    if (F.wePay && we.length) L.push(`주말 시급: ${won(F.wePay)}`);
  }
  if (F.payType) L.push(`급여 방식: ${F.payType}`);
  if (F.payDay.trim()) L.push(`급여 지급일: ${F.payDay.trim()}`);
  return L.join("\n");
}

async function load() {
  try { DATA = await api("overview"); } catch (e) { $("#view").innerHTML = `<div class="empty">⚠️ ${esc(e.message)}</div>`; return false; }
  return true;
}

function setTab(t) {
  tab = t;
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
  render();
}
document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => { location.hash = ""; setTab(b.dataset.t); }));

function render() {
  const h = location.hash.slice(1);
  if (h.startsWith("job=")) return renderJob(h.slice(4));
  if (h.startsWith("stu=")) return renderStudent(h.slice(4));
  if (h.startsWith("new")) { // 봇 /find 에서 [📝 양식 채우기] → #new=urgent:0
    const [k, o] = (h.split("=")[1] ?? "").split(":");
    if (k) { NEW.kind = k === "normal" ? "normal" : "urgent"; NEW.off = o === "" || o == null ? null : Number(o); }
    history.replaceState(null, "", location.pathname + location.search);
    tab = "new"; document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === "new"));
  }
  ({ jobs: renderJobs, students: renderStudents, new: renderNew, stats: renderStats })[tab]();
}
window.addEventListener("hashchange", render);

// ── 📋 공고 ──
function renderJobs() {
  const list = DATA.jobs.filter((j) => (jobFilter === "open" ? !j.closed : jobFilter === "closed" ? j.closed : true));
  $("#view").innerHTML = `
    <div class="chips">${[["open", "열린 공고"], ["closed", "모집 완료"], ["all", "전체"]].map(([k, n]) => `<button class="chip ${jobFilter === k ? "on" : ""}" data-f="${k}">${n}</button>`).join("")}</div>
    ${list.length ? list.map(jobCard).join("") : `<div class="empty">공고가 없어요.<br>✍️ 새 공고 탭이나 봇의 /find 로 올려보세요.</div>`}`;
  document.querySelectorAll("[data-f]").forEach((b) => (b.onclick = () => { jobFilter = b.dataset.f; renderJobs(); }));
  document.querySelectorAll("[data-job]").forEach((c) => (c.onclick = () => (location.hash = `job=${c.dataset.job}`)));
}
const jobCard = (j) => `
  <div class="card" data-job="${j.id}">
    <div class="row">
      <span class="pill ${j.kind === "urgent" ? "urgent" : ""}">${j.kind === "urgent" ? "🚨 긴급" : "📢 일반"}</span>
      ${j.dateLabel ? `<span class="pill">📅 ${esc(j.dateLabel)}</span>` : ""}
      <span class="sp"></span>
      <span class="pill ${j.closed ? "closed" : "open"}">${j.closed ? "✅ 모집 완료" : "모집 중"}</span>
    </div>
    <div class="title" style="margin-top:6px">#${j.id} ${esc(j.title)}</div>
    <div class="muted">🙋 지원 ${j.applied}${j.slots ? ` / ${j.slots}명` : "명"}${j.attOk || j.attNo ? ` · ✅ ${j.attOk} ❌ ${j.attNo}` : ""} · ${ago(j.at)}${j.repostOf ? ` · #${j.repostOf} 다시 올림` : ""}</div>
  </div>`;

async function renderJob(id) {
  $("#view").innerHTML = `<button class="back" onclick="history.back()">‹ 목록</button><div class="skel"></div><div class="skel"></div>`;
  let d;
  try { d = await api("job", { id }); } catch (e) { $("#view").innerHTML = `<button class="back" onclick="history.back()">‹ 목록</button><div class="empty">⚠️ ${esc(e.message)}</div>`; return; }
  const j = d.job;
  const left = j.slots ? Math.max(0, j.slots - j.applied) : null;
  const unmarked = d.applicants.filter((a) => !a.att).length;
  $("#view").innerHTML = `
    <button class="back" onclick="location.hash=''">‹ 목록</button>
    <div class="card">
      <div class="row">
        <span class="pill ${j.kind === "urgent" ? "urgent" : ""}">${j.kind === "urgent" ? "🚨 긴급" : "📢 일반"}</span>
        ${j.dateLabel ? `<span class="pill">📅 ${esc(j.dateLabel)}</span>` : ""}
        <span class="sp"></span>
        <span class="pill ${j.closed ? "closed" : "open"}">${j.closed ? "✅ 모집 완료" : "모집 중"}</span>
      </div>
      <div class="pre">${esc(j.text)}</div>
      <div class="muted">공고 #${j.id} · 🙋 지원 ${j.applied}${j.slots ? ` / ${j.slots}명 (남은 ${left}명)` : "명"} · ${j.inGroup ? "👥 그룹방(채널)" : "📩 1:1만"}</div>
      <div class="btns">
        ${j.closed ? `<button class="btn ghost sm" id="reopen">🔓 다시 열기</button>` : `<button class="btn red sm" id="close">✅ 모집 완료</button>`}
        <button class="btn sm" id="repost">📢 다시 올리기</button>
      </div>
    </div>
    <div class="row" style="margin:14px 2px 8px"><b class="sp">지원자 ${d.applicants.length}명</b>${d.applicants.length && unmarked ? `<button class="btn sm" id="attall" title="출근·빵꾸를 아직 안 누른 지원자를 모두 출근으로">✅ 체크 안 한 사람 모두 출근</button>` : ""}</div>
    ${d.applicants.length ? d.applicants.map((a) => `
      <div class="card">
        <div class="row">
          <div class="sp">
            <div class="title">${badge(a)} ${esc(a.name)} <span class="muted">${a.gender ?? ""} ${a.age ?? ""}세</span></div>
            <div class="muted">${a.guest || !a.school ? `정보 없이 지원 (일당·단기)${a.username ? ` · @${esc(a.username)}` : ""}` : `${a.phone ? `<a href="tel:${esc(a.phone)}">📞 ${esc(a.phone)}</a>` : "📞 번호 없음"} · ${esc(a.school)} · TOPIK ${esc(a.topik)}${a.car ? " · 🚗" : ""}`}</div>
            <div class="muted">출근 ${a.workOk} · 빵꾸 ${a.workNo} · ${ago(a.appliedAt)} 지원</div>
          </div>
        </div>
        <div class="btns" style="margin-top:8px">
          <button class="btn ghost sm" data-stu="${a.id}">학생 카드</button>
          ${a.username ? `<button class="btn ghost sm" data-chat="${esc(a.username)}">💬 대화</button>` : ""}
        </div>
        <div class="grp">근무 당일 — 출근 체크</div>
        <div class="row" style="gap:6px">
          <button class="att ok ${a.att === "ok" ? "on" : ""}" data-att="ok" data-uid="${a.id}">✅ 출근함</button>
          <button class="att no ${a.att === "no" ? "on" : ""}" data-att="no" data-uid="${a.id}">❌ 안 옴 (빵꾸)</button>
        </div>
        <div class="grp">근무 전 — 지원 취소</div>
        <div class="row" style="gap:6px">
          <button class="btn red sm" data-nocancel="${a.id}" style="flex:1">🚫 직전 취소 (빵꾸)</button>
          <button class="btn ghost sm" data-unapply="${a.id}" style="flex:1">↩️ 그냥 취소</button>
        </div>
      </div>`).join("") : `<div class="empty">아직 지원자가 없어요</div>`}`;
  const act = async (fn, msg) => { try { haptic(); await fn(); toast(msg); await load(); renderJob(id); } catch (e) { toast("⚠️ " + e.message); } };
  $("#close") && ($("#close").onclick = () => tg?.showConfirm ? tg.showConfirm("모집 완료로 할까요? 채널 공고도 '모집 완료'로 바뀌어요.", (ok) => ok && act(() => api("close", { id }), "✅ 모집 완료했어요")) : act(() => api("close", { id }), "✅ 모집 완료했어요"));
  $("#reopen") && ($("#reopen").onclick = () => act(() => api("reopen", { id }), "🔓 다시 열었어요"));
  $("#attall") && ($("#attall").onclick = () => act(() => api("attall", { id }), "✅ 기록했어요"));
  $("#repost").onclick = () => {
    // 몇 명 다시 뽑을지 입력칸 (텔레그램 안에서는 prompt 창이 안 뜨는 폰이 있어서 화면에 직접)
    const box = $("#repost").parentElement;
    box.innerHTML = `<div style="width:100%"><label class="f" style="margin-top:0">몇 명 다시 모집할까요? <span class="muted">(비우면 인원 안 셈)</span></label>
      <div class="row"><input id="rs" inputmode="numeric" value="${left ?? j.slots ?? ""}" class="sp"><button class="btn sm" id="rsGo">📢 맨 아래에 다시 올리기</button></div>
      <div class="muted" style="margin-top:6px">새 공고가 그룹방(채널) 맨 아래에 🚨 급구로 올라가고, 이 공고는 모집 완료로 바뀌어요.</div></div>`;
    $("#rsGo").onclick = () => act(async () => { const r = await api("repost", { id, slots: $("#rs").value || null }); location.hash = `job=${r.id}`; }, "📢 맨 아래에 다시 올렸어요");
  };

const stuSel = new Set();
let stuPick = false; // ☑ 골라서 지우기 모드
const confirmDo = (msg, fn) => (tg?.showConfirm ? tg.showConfirm(msg, (ok) => ok && fn()) : confirm(msg) && fn());
async function delStudents(ids) {
  try { haptic(); const r = await api("del", { uids: ids }); ids.forEach((i) => stuSel.delete(String(i))); toast(`🗑 ${r.n}명 지웠어요`); await load(); return true; } catch (e) { toast("⚠️ " + e.message); return false; }
}
function renderStudents() {
  const q = stuQ.trim().toLowerCase();
  let list = DATA.students.filter((s) => !q || [s.name, s.school, s.phone, s.tgName, s.username].some((v) => String(v ?? "").toLowerCase().includes(q)));
  if (stuF.m) list = list.filter((s) => s.gender === "남");
  if (stuF.f) list = list.filter((s) => s.gender === "여");
  if (stuF.t3) list = list.filter((s) => s.topikN >= 2);
  if (stuF.car) list = list.filter((s) => s.car);
  if (stuF.star) list = list.filter((s) => badge(s) === "⭐");
  if (stuF.flaky) list = list.filter((s) => s.workNo >= 2);
  if (stuF.newOnly) list = list.filter((s) => s.status === "new");
  const chip = (k, n) => `<button class="chip ${stuF[k] ? "on" : ""}" data-sf="${k}">${n}</button>`;
  $("#view").innerHTML = `
    <input id="q" placeholder="이름 · 학교 · 전화 검색" value="${esc(stuQ)}" style="margin-bottom:10px">
    <div class="chips">${chip("newOnly", "🆕 신규")}${chip("m", "남")}${chip("f", "여")}${chip("t3", "TOPIK 3급↑")}${chip("star", "⭐ 성실")}${chip("flaky", "⚠️ 빵꾸")}</div>
    <div class="row" style="margin:0 2px 8px;flex-wrap:wrap"><span class="muted sp">${list.length}명${stuPick ? ` · <b>${stuSel.size}명 고름</b>` : ""}</span>
      ${stuPick
        ? `<button class="btn ghost sm" id="selAll">${list.length && list.every((s) => stuSel.has(String(s.id))) ? "모두 풀기" : "모두 선택"}</button>`
        : `<button class="btn ghost sm" id="pickOn">☑ 고르기</button>`}
    </div>
    ${stuPick ? "" : `<div class="muted" style="margin:-4px 2px 8px;font-size:12px">💡 학생 카드를 꾹 누르면(PC는 마우스 오른쪽 클릭) 여러 명을 골라 한꺼번에 처리할 수 있어요</div>`}
    ${list.slice(0, 300).map((s) => `
      <div class="card" data-s="${s.id}" ${stuPick && stuSel.has(String(s.id)) ? 'style="outline:2px solid var(--no)"' : ""}>
        <div class="row">${stuPick ? `<input type="checkbox" ${stuSel.has(String(s.id)) ? "checked" : ""} style="width:20px;height:20px;margin:0" aria-label="고르기">` : ""}<span class="title sp">${badge(s)} ${esc(s.name)} <span class="muted">${s.gender ?? ""} ${s.age ?? ""}세</span></span><span class="pill">${STATUS[s.status] ?? ""}</span></div>
        <div class="muted">${esc(s.school)} · TOPIK ${esc(s.topik)}${s.car ? " · 🚗" : ""} · 수업 ${s.days.length ? s.days.join("·") : "없음"}${s.workOk || s.workNo ? ` · 출근 ${s.workOk} 빵꾸 ${s.workNo}` : ""}</div>
      </div>`).join("") || `<div class="empty">학생이 없어요</div>`}
    ${stuPick ? `<div style="height:76px"></div><div style="position:fixed;left:0;right:0;bottom:0;background:var(--bg2,#f2f3f5);border-top:1px solid #8883;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:40">
      <button class="btn ghost" id="pickOff" style="flex:0 0 auto">✕</button>
      <button class="btn" id="daysSel" style="flex:1" ${stuSel.size ? "" : "disabled"}>🔄 수업 요일 다시 받기${stuSel.size ? ` (${stuSel.size})` : ""}</button>
      <button class="btn red" id="delSel" style="flex:0 0 auto" ${stuSel.size ? "" : "disabled"}>🗑 지우기</button>
    </div>` : ""}`;
  const qi = $("#q");
  qi.oninput = () => { stuQ = qi.value; const pos = qi.selectionStart; renderStudents(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
  document.querySelectorAll("[data-sf]").forEach((b) => (b.onclick = () => { const k = b.dataset.sf; stuF[k] = !stuF[k]; if (k === "m" && stuF.m) stuF.f = false; if (k === "f" && stuF.f) stuF.m = false; renderStudents(); }));
  // 갤러리처럼: 꾹 누르기(0.5초)·마우스 오른쪽 클릭 → 고르기 시작, 그다음엔 누를 때마다 고름/풂
  const startPick = (k) => { haptic(); stuPick = true; stuSel.add(k); renderStudents(); };
  document.querySelectorAll("[data-s]").forEach((c) => {
    let timer = null, longDone = false;
    c.onpointerdown = () => { longDone = false; if (stuPick) return; timer = setTimeout(() => { longDone = true; startPick(c.dataset.s); }, 500); };
    c.onpointerup = c.onpointerleave = c.onpointercancel = () => clearTimeout(timer);
    c.oncontextmenu = (e) => { e.preventDefault(); clearTimeout(timer); if (!stuPick) { longDone = true; startPick(c.dataset.s); } };
    c.onclick = () => {
      if (longDone) { longDone = false; return; }
      if (!stuPick) return (location.hash = `stu=${c.dataset.s}`);
      const k = c.dataset.s; stuSel.has(k) ? stuSel.delete(k) : stuSel.add(k); renderStudents();
    };
  });
  $("#daysSel") && ($("#daysSel").onclick = () => {
    if (!stuSel.size) return;
    confirmDo(`고른 학생 ${stuSel.size}명에게 수업 요일을 다시 물어볼까요? (학생 봇 대화로 질문이 가요)`, async () => {
      try { haptic(); const r = await api("days", { uids: [...stuSel] }); toast(`🔄 ${r.ok}명에게 보냈어요${r.fail ? ` · ${r.fail}명 실패(봇 차단 등)` : ""}`); stuPick = false; stuSel.clear(); renderStudents(); } catch (e) { toast("⚠️ " + e.message); }
    });
  });
  $("#pickOn") && ($("#pickOn").onclick = () => { stuPick = true; stuSel.clear(); renderStudents(); });
  $("#pickOff") && ($("#pickOff").onclick = () => { stuPick = false; stuSel.clear(); renderStudents(); });
  $("#selAll") && ($("#selAll").onclick = () => { const all = list.every((s) => stuSel.has(String(s.id))); list.forEach((s) => (all ? stuSel.delete(String(s.id)) : stuSel.add(String(s.id)))); renderStudents(); });
  $("#delSel") && ($("#delSel").onclick = () => {
    if (!stuSel.size) return;
    confirmDo(`고른 학생 ${stuSel.size}명의 자기소개서·기록을 지울까요? 되돌릴 수 없어요. (지운 학생은 다음 지원 때 자기소개서를 다시 써요)`, async () => { if (await delStudents([...stuSel])) { stuPick = false; renderStudents(); } });
  });
}

function calHtml() {
  const [y, m] = NEW.calM.split("-").map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
  const n = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const today = todayISO();
  const cells = Array(first).fill("").concat([...Array(n)].map((_, i) => `${NEW.calM}-${String(i + 1).padStart(2, "0")}`));
  const cell = (iso) => {
    if (!iso) return "<span></span>";
    const past = iso < today, on = NEW.calMode === "start" ? F.startDate === iso : F.dates.includes(iso);
    return `<button class="chip ${on ? "on" : ""}" data-cd="${iso}" ${past ? "disabled" : ""} style="margin:0;padding:8px 0;min-width:0;${past ? "opacity:.3" : ""}${iso === today && !on ? ";border:1.5px solid var(--btn)" : ""}">${Number(iso.slice(8))}</button>`;
  };
  return `<div style="position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:50">
    <div class="card" style="width:100%;max-width:420px;margin:0;border-radius:16px 16px 0 0;padding:14px 14px 20px">
      <div class="row"><button class="btn ghost sm" data-cm="-1" type="button" aria-label="이전 달">‹</button><b class="sp" style="text-align:center">${y}년 ${m}월</b><button class="btn ghost sm" data-cm="1" type="button" aria-label="다음 달">›</button></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center">
        ${WD.map((w) => `<span class="muted" style="font-size:12px">${w}</span>`).join("")}${cells.map(cell).join("")}
      </div>
      ${NEW.calMode === "start"
        ? `<div class="muted" style="margin-top:10px">${F.startDate ? `첫 출근일: ${isoDay(F.startDate)}` : "첫 출근일을 눌러 고르세요"}</div>
      <div class="btns" style="margin-top:10px"><button class="btn ghost" id="calClear" type="button">날짜 상관없음</button><button class="btn" id="calDone" type="button" style="flex:1">완료</button></div>`
        : `<div class="muted" style="margin-top:10px">${F.dates.length ? `${F.dates.length}일 고름: ${[...F.dates].sort().map(isoDay).join(" · ")}` : "날짜를 눌러 고르세요 (여러 날 가능)"}</div>

    </div></div>`;

        <input data-f="count" inputmode="numeric" placeholder="인원" value="${esc(F.count)}" style="width:80px"><span>명</span></div>
      <label class="f">📍 근무 위치</label><input data-f="addr" placeholder="경기도 고양시 덕이로 264-11" value="${esc(F.addr)}">
      ${F.payType === "시간제" ? `<label class="f">📅 근무 날짜 <span class="muted">(여러 날 고를 수 있어요)</span></label>
      <button class="btn ghost" id="calBtn" type="button" style="width:100%;text-align:left">📅 ${F.dates.length ? [...F.dates].sort().map(isoDay).join(" · ") : "날짜 고르기"}</button>
      <label class="f">🕘 근무시간</label>
      <div class="row" style="gap:6px"><input type="time" data-f="wdS" value="${esc(F.wdS)}"><span>~</span><input type="time" data-f="wdE" value="${esc(F.wdE)}"></div>` : `<label class="f">📅 근무요일 <span class="muted">(누르면 고름 · 안 고른 날은 휴무)</span></label>
      <div class="chips">${DAYS.map((x, i) => `<button class="chip ${F.days.includes(i) ? "on" : ""}" data-day="${i}">${x}</button>`).join("")}</div>`}
      ${F.payType !== "시간제" && (!F.days.length || F.days.some((x) => x < 5)) ? `<label class="f">🕘 평일 근무시간</label>
      <div class="row" style="gap:6px"><input type="time" data-f="wdS" value="${esc(F.wdS)}"><span>~</span><input type="time" data-f="wdE" value="${esc(F.wdE)}"></div>` : ""}
      ${F.payType !== "시간제" && F.days.some((x) => x >= 5) ? `<label class="f">🕙 주말 근무시간</label>
      <div class="row" style="gap:6px"><input type="time" data-f="weS" value="${esc(F.weS)}"><span>~</span><input type="time" data-f="weE" value="${esc(F.weE)}"></div>` : ""}
      ${F.payType === "월급제" ? `<label class="f">💰 월급 <span class="muted">(원)</span></label><input data-f="wdPay" inputmode="numeric" placeholder="2500000" value="${esc(F.wdPay)}">` : `<label class="f">💰 ${F.payType !== "시간제" && F.days.some((x) => x >= 5) && F.days.some((x) => x < 5) ? "평일 시급" : "시급"} <span class="muted">(원)</span></label><input data-f="wdPay" inputmode="numeric" placeholder="12500" value="${esc(F.wdPay)}">`}
      ${F.payType === "주급제" && F.days.some((x) => x >= 5) && F.days.some((x) => x < 5) ? `<label class="f">💰 주말 시급 <span class="muted">(원)</span></label><input data-f="wePay" inputmode="numeric" placeholder="15000" value="${esc(F.wePay)}">` : ""}
      <label class="f">급여 지급일</label><input data-f="payDay" placeholder="${{ 시간제: "근무 당일 / 다음 날", 주급제: "근무 후 약 1주일 뒤 수요일 또는 금요일", 월급제: "매월 10일" }[F.payType] ?? ""}" value="${esc(F.payDay)}">
    </div>
    <div class="card">
      <div class="row"><b class="sp">👀 미리보기</b><button class="btn ghost sm" id="toRaw" type="button">✏️ 글로 직접 고치기</button></div>
      <pre id="pv" style="white-space:pre-wrap;font:inherit;margin:8px 0 0">${esc(composeJob())}</pre>
    </div>`}${NEW.calOpen ? calHtml() : ""}
    <div class="card">
      <label class="f" style="margin-top:0">보낼 곳</label>
      <div class="chips">${c("where", "g", "👥 그룹방(채널)")}${c("where", "d", "📩 맞는 학생 1:1")}${c("where", "b", "👥 + 📩 둘 다")}</div>
      ${NEW.where !== "g" ? `
        <label class="f">1:1 받을 학생 조건 <span class="muted">(첫 근무일에 수업 없는 학생만)</span></label>
        <div class="chips">${c("topik", 0, "TOPIK 상관없음")}${c("topik", 1, "1급↑")}${c("topik", 2, "3급↑")}${c("topik", 3, "4급↑")}</div>
        <div class="chips">${c("gender", "", "성별 상관없음")}${c("gender", 0, "남자만")}${c("gender", 1, "여자만")}</div>
        <div class="chips"><button class="chip ${NEW.noFlaky ? "on" : ""}" id="nf">⚠️ 빵꾸 2번↑ 빼기</button></div>
        <div class="count" id="cnt">맞는 학생 세는 중…</div>` : ""}
      <div class="btns"><button class="btn" id="send" style="flex:1">보내기</button></div>
    </div>`;
  const sync = () => {
    if (NEW.raw) { NEW.text = $("#text").value; NEW.slots = $("#slots").value; }
    else { NEW.text = composeJob(); NEW.slots = F.count ? String(F.count) : ""; }
  };
  // 📅 달력 (시간제 = 여러 날, 주급·월급제 첫 출근일 = 하루)
  const openCal = (mode) => { NEW.calMode = mode; NEW.calOpen = true; NEW.calM = (mode === "start" ? F.startDate : [...F.dates].sort()[0])?.slice(0, 7) || todayISO().slice(0, 7); renderNew(); };
  $("#calBtn") && ($("#calBtn").onclick = () => openCal("multi"));
  $("#startBtn") && ($("#startBtn").onclick = () => openCal("start"));
  document.querySelectorAll("[data-cd]").forEach((b) => (b.onclick = () => {
    const v = b.dataset.cd;
    if (NEW.calMode === "start") { F.startDate = F.startDate === v ? "" : v; NEW.calOpen = false; }
    else F.dates = F.dates.includes(v) ? F.dates.filter((x) => x !== v) : [...F.dates, v];
    renderNew();
  }));
  document.querySelectorAll("[data-cm]").forEach((b) => (b.onclick = () => { const [y, m] = NEW.calM.split("-").map(Number); const d = new Date(Date.UTC(y, m - 1 + Number(b.dataset.cm), 1)); NEW.calM = d.toISOString().slice(0, 7); renderNew(); }));
  $("#calDone") && ($("#calDone").onclick = () => { NEW.calOpen = false; renderNew(); });
  $("#calClear") && ($("#calClear").onclick = () => { if (NEW.calMode === "start") { F.startDate = ""; NEW.calOpen = false; } else F.dates = []; renderNew(); });
  document.querySelectorAll("[data-pt]").forEach((b) => (b.onclick = () => {
    if (F.payType === "월급제" || b.dataset.pt === "월급제") F.wePay = "";
    if (F.payType && (F.payType === "월급제") !== (b.dataset.pt === "월급제")) F.wdPay = ""; // 월급 ↔ 시급 바꾸면 금액 비움
    F.payType = b.dataset.pt;
    renderNew();
  }));
  if (!F.payType && !NEW.raw) {
    $("#send").disabled = true;
    $("#past0").onclick = () => { F.payType = "시간제"; NEW.pastOpen = true; renderNew(); };
  } else if (NEW.raw) {
    $("#text").oninput = () => { sync(); const m = (/(\d{1,3})\s*명/.exec(NEW.text) || [])[1]; $("#slots").placeholder = m ?? "비우면 인원 안 셈"; };
    $("#slots").oninput = sync;
    $("#toForm").onclick = () => { if (!confirm("칸 채우기로 돌아가면 직접 고친 글은 사라져요. 돌아갈까요?")) return; NEW.raw = false; renderNew(); };
  } else {
    $("#send").disabled = false;
    document.querySelectorAll("[data-f]").forEach((el) => (el.oninput = () => { F[el.dataset.f] = el.value; $("#pv").textContent = composeJob(); }));
    document.querySelectorAll("[data-day]").forEach((b) => (b.onclick = () => { const i = Number(b.dataset.day); F.days = F.days.includes(i) ? F.days.filter((x) => x !== i) : [...F.days, i]; renderNew(); }));
    document.querySelectorAll("[data-sex]").forEach((b) => (b.onclick = () => { F.sex = b.dataset.sex; renderNew(); }));

    $("#past").onclick = () => { NEW.pastOpen = !NEW.pastOpen; renderNew(); };
    document.querySelectorAll("[data-past]").forEach((b) => (b.onclick = () => {
      const j = DATA.jobs.find((x) => String(x.id) === b.dataset.past); if (!j) return;
      NEW.pastOpen = false;
      if (j.form) { Object.assign(F, JSON.parse(JSON.stringify(j.form)), { dates: [], startDate: "" }); /* 날짜는 매번 새로 고름 */ toast(`#${j.id} 불러왔어요 — 날짜·인원만 확인하세요`); }
      else { NEW.text = j.text; NEW.slots = ""; NEW.raw = true; toast(`#${j.id} 글을 불러왔어요 (예전 공고라 글로 고쳐요)`); }
      renderNew();
    }));
    $("#toRaw").onclick = () => { NEW.text = composeJob(); NEW.slots = F.count ? String(F.count) : ""; NEW.raw = true; renderNew(); };
  }
  document.querySelectorAll("[data-n]").forEach((b) => (b.onclick = () => { sync(); const k = b.dataset.n; const v = b.dataset.v; NEW[k] = v === "" ? (k === "off" ? null : "") : isNaN(Number(v)) ? v : Number(v); renderNew(); }));
  $("#car") && ($("#car").onclick = () => { sync(); NEW.car = !NEW.car; renderNew(); });
  $("#nf") && ($("#nf").onclick = () => { sync(); NEW.noFlaky = !NEW.noFlaky; renderNew(); });
  if (NEW.where !== "g") {
    clearTimeout(countTimer);
    countTimer = setTimeout(async () => {
      try {
        const r = await api("count", { filter: { off: !NEW.raw && F.payType === "시간제" ? (F.dates.length ? isoOff([...F.dates].sort()[0]) : null) : !NEW.raw && F.payType ? (F.startDate ? isoOff(F.startDate) : null) : NEW.off, topik: NEW.topik, car: NEW.car, gender: NEW.gender, noFlaky: NEW.noFlaky } });
        const el = $("#cnt"); if (!el) return;
        el.innerHTML = `📩 맞는 학생 <b>${r.count}명</b>${r.count ? `<div class="muted" style="margin-top:4px">${r.sample.slice(0, 12).map((s) => `${badge(s)}${esc(s.name)}`).join(", ")}${r.count > 12 ? " …" : ""}</div>` : ""}`;
      } catch (e) { const el = $("#cnt"); if (el) el.textContent = "⚠️ " + e.message; }
    }, 250);
  }
  $("#send").onclick = () => {
    sync();
    if (!NEW.raw && F.payType === "시간제") {
      if (!F.dates.length) return toast("근무 날짜를 골라 주세요");
      NEW.off = isoOff([...F.dates].sort()[0]); // 첫 근무일 = 출근 확인·1:1 학생 고르기 기준
    } else if (!NEW.raw && F.payType) NEW.off = F.startDate ? isoOff(F.startDate) : null; // 주급·월급제 첫 출근일
    if (!NEW.raw && !F.title.trim()) return toast("제목을 써 주세요");
    if (!NEW.text.trim()) return toast("공고 내용을 써 주세요");
    const where = { g: "그룹방(채널)에 올릴까요?", d: "맞는 학생에게 1:1로 보낼까요?", b: "그룹방에 올리고 1:1로도 보낼까요?" }[NEW.where];
    const go = async () => {
      const btn = $("#send"); btn.disabled = true; btn.textContent = "보내는 중…";
      try {
        const r = await api("send", { text: NEW.text, kind: NEW.kind, off: NEW.off, slots: NEW.slots || null, where: NEW.where, form: NEW.raw ? null : { ...F }, filter: { topik: NEW.topik, car: NEW.car, gender: NEW.gender, noFlaky: NEW.noFlaky } });
        toast(`✅ 공고 #${r.id} — ${r.out.join(" · ")}`);
        Object.assign(NEW, { text: "", slots: "", raw: false });
        Object.assign(F, { title: "", task: "", sex: "", count: "", addr: "", days: [], dates: [], startDate: "", wdS: "", wdE: "", weS: "", weE: "", wdPay: "", wePay: "", payType: "", payDay: "" });
        await load(); setTab("jobs"); location.hash = `job=${r.id}`;
      } catch (e) { toast("⚠️ " + e.message); btn.disabled = false; btn.textContent = "보내기"; }
    };
    tg?.showConfirm ? tg.showConfirm(where, (ok) => ok && go()) : go();
  };
}

// ── 📊 현황 ──
function renderStats() {
  const s = DATA.stats;
  $("#view").innerHTML = `
    <div class="stat">
      <div class="card"><span class="muted">전체 학생</span><b>${s.students}</b><span class="muted">🆕 신규 ${s.newStudents}명</span></div>
      <div class="card"><span class="muted">이번 주 공고</span><b>${s.weekJobs}</b><span class="muted">지원 ${s.weekApplies}건</span></div>
      <div class="card"><span class="muted">이번 주 충원율</span><b>${s.fillRate == null ? "-" : s.fillRate + "%"}</b><span class="muted">인원 쓴 공고 기준</span></div>
      <div class="card"><span class="muted">이번 주 빵꾸</span><b>${s.weekNoShow}</b><span class="muted">출근 확인 기준</span></div>
    </div>
    <div class="card" style="margin-top:10px">
      <b>⚠️ 빵꾸 많은 학생</b>
      ${s.flaky.length ? s.flaky.map((x) => `<div class="hist"><a href="#stu=${x.id}">${esc(x.name)}</a> · 빵꾸 ${x.workNo} · 출근 ${x.workOk}</div>`).join("") : `<div class="muted" style="margin-top:6px">없어요 👍</div>`}
    </div>`;
}

(async () => { if (await load()) render(); })();
document.addEventListener("visibilitychange", async () => { if (!document.hidden && DATA) { await load(); render(); } });
</script>
</body>
</html>
