<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GIEC JOB 관리</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #16181d);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --link: var(--tg-theme-link-color, #2a6fdb);
    --btn: var(--tg-theme-button-color, #2a6fdb);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--hint) 25%, transparent);
    --ok: #1f9d55; --no: #d64545; --warn: #d98a00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; background: var(--bg2); color: var(--text); padding-bottom: 72px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 14px 0; }
  header h1 { margin: 0 0 8px; font-size: 17px; }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav button { flex: 1; min-width: 70px; border: 0; background: none; color: var(--hint); padding: 9px 4px 10px; font-size: 14px; border-bottom: 2px solid transparent; }
  nav button.on { color: var(--text); border-color: var(--btn); font-weight: 600; }
  main { padding: 12px; max-width: 720px; margin: 0 auto; }
  .card { background: var(--bg); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .sp { flex: 1; min-width: 0; }
  .muted { color: var(--hint); font-size: 13px; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--bg2); color: var(--hint); white-space: nowrap; }
  .pill.urgent { background: #ffe6e6; color: #c0392b; }
  .pill.open { background: #e5f6ec; color: var(--ok); }
  .pill.closed { background: var(--bg2); color: var(--hint); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
  .chip { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .chip.on { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .btn { border: 0; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600; background: var(--btn); color: var(--btn-text); }
  .btn.ghost { background: var(--bg2); color: var(--text); }
  .btn.red { background: #fdeaea; color: var(--no); }
  .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .4; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  input, textarea, select { width: 100%; font: inherit; color: var(--text); background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 130px; resize: vertical; }
  label.f { display: block; font-size: 13px; color: var(--hint); margin: 12px 0 6px; }
  .pre { white-space: pre-wrap; background: var(--bg2); border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 14px; }
  .stat { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat .card { margin: 0; }
  [data-s], [data-job] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .stat b { display: block; font-size: 24px; }
  .att { flex: 1; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; border: 1.5px solid var(--line); background: var(--bg); color: var(--text); }
  .att.ok.on { background: #e5f6ec; border-color: var(--ok); color: #13723f; }
  .att.no.on { background: #fdeaea; border-color: var(--no); color: var(--no); }
  .rk { display: inline-block; min-width: 20px; padding: 0 5px; border-radius: 6px; color: #fff; font-size: 12px; font-weight: 800; text-align: center; margin-right: 4px; vertical-align: 1px; }
  .rks { display: inline-flex; gap: 4px; }
  .rkb { width: 34px; height: 30px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--text); font-weight: 800; font-size: 13px; }
  .tp { display: flex; align-items: center; gap: 4px; position: relative; }
  .tp input { width: 52px; text-align: center; padding-left: 4px; padding-right: 4px; }
  .tp .ap { min-width: 52px; }
  .tp .dd { padding: 6px 8px; }
  .scrolly { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .pop { position: absolute; top: 100%; z-index: 30; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 18px #0002; max-height: 220px; overflow: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; width: 220px; }
  .pop button { padding: 8px 0; border-radius: 8px; border: 0; background: var(--bg2); color: var(--text); font-size: 14px; }
  .mgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0 6px; }
  .mthumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--bg2); display: grid; place-items: center; font-size: 22px; }
  .mthumb img, .mthumb video { width: 100%; height: 100%; object-fit: cover; }
  .mthumb button { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: #000a; color: #fff; font-size: 12px; line-height: 22px; padding: 0; }
  .mthumb .mtag { position: absolute; left: 4px; bottom: 4px; background: #000a; color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 4px; }
  .grp { font-size: 12px; color: var(--hint, #8a9099); margin: 10px 0 4px; }
  a { color: var(--link); text-decoration: none; }
  .empty { text-align: center; color: var(--hint); padding: 40px 10px; }
  .back { border: 0; background: none; color: var(--link); font-size: 15px; padding: 0 0 10px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 90%; }
  .toast.show { opacity: .95; }
  .skel { height: 64px; border-radius: 12px; background: linear-gradient(90deg, var(--bg) 0%, var(--bg2) 50%, var(--bg) 100%); background-size: 200% 100%; animation: sh 1.2s infinite; margin-bottom: 10px; }
  @keyframes sh { to { background-position: -200% 0; } }
  .hist { font-size: 13px; margin: 2px 0; }
  .count { font-size: 14px; margin: 10px 0; padding: 10px 12px; border-radius: 10px; background: var(--bg2); }
  /* 🏢 업장 탭 (11-06) */
  .sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
  .sum .card { margin: 0; padding: 10px 12px; }
  .sum b { display: block; font-size: 22px; }
  .pill.live { background: #e5f6ec; color: #13723f; font-weight: 700; }
  .pill.wait { background: #fff2b3; color: #6b5200; font-weight: 700; }
  .pill.blue { background: #e3efff; color: #1f5fbf; }
  [data-place], [data-pjob], [data-go] { cursor: pointer; }
  .more { border: 0; background: none; color: var(--link); font-size: 13px; padding: 6px 0 0; }
  .kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 10px; font-size: 14px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .kv > span:nth-child(odd) { color: var(--hint); font-size: 13px; }
  .seg { display: flex; gap: 4px; background: var(--bg); border-radius: 12px; padding: 4px; margin: 12px 0 10px; }
  .seg button { flex: 1; border: 0; border-radius: 9px; padding: 10px 6px; font-size: 14px; font-weight: 700; background: none; color: var(--hint); }
  .seg button.on { background: var(--btn); color: var(--btn-text); }
  .btn.big { width: 100%; padding: 13px 14px; font-size: 15px; }
  .btn.green { background: var(--ok); color: #fff; }
  .btn.off { background: var(--bg2); color: var(--hint); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 60; }
  .modal .card { width: 100%; max-width: 440px; margin: 0; }
</style>
</head>
<body>
<header>
  <h1>🛠 GIEC JOB 관리</h1>
  <nav id="tabs">
    <button data-t="places" class="on">🏢 업장</button>
    <button data-t="jobs">📋 공고</button>
    <button data-t="students">👥 학생</button>
  </nav>
</header>
<main id="view"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
try { tg?.disableVerticalSwipes?.(); } catch {} // 목록을 손가락으로 끌어 올리고 내릴 때 미니앱이 닫히지 않게
// ⌨️ 아이폰: 빈 곳을 눌러도 키보드가 안 내려감 (11-06 혜승) → 입력칸·버튼이 아닌 곳을 누르면 키보드 내림, 한 줄 칸은 [완료/return]으로도 내림
const hideKb = () => { const a = document.activeElement; if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) a.blur(); try { tg?.hideKeyboard?.(); } catch {} };
document.addEventListener("pointerdown", (e) => {
  const a = document.activeElement;
  if (!a || !/^(INPUT|TEXTAREA)$/.test(a.tagName)) return;
  if (e.target.closest("input, textarea, select, button, a, label, [contenteditable], [data-place], [data-pjob], [data-go], [data-job], [data-stu], .chip, .att, .pop, #wkList")) return;
  hideKb();
}, true);
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.tagName === "INPUT" && !e.isComposing) hideKb(); });
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); };
const haptic = () => tg?.HapticFeedback?.impactOccurred?.("light");

// 이미 올라간 사진(텔레그램 file_id) 작은 그림 — /api/file이 관리자 확인 후 대신 가져옴
const fileUrl = (id) => `/api/file?id=${encodeURIComponent(id)}&i=${encodeURIComponent(tg?.initData ?? "")}`;
async function api(action, args = {}) {
  const r = await fetch("/api/mini", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ area: "admin", action, initData: tg?.initData ?? "", ...args }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "오류");
  return j;
}

const STATUS = { new: "🆕 신규", contacted: "🟡 연락완료", introduced: "🟢 연결완료", closed: "⚫ 종결" }; // 종결 버튼은 없앰(11-04), 예전 값 표시용
const badge = (s) => (s.workNo >= 2 ? "⚠️" : s.workOk >= 3 && !s.workNo ? "⭐" : "");
// ⭐ 랭크 S·A·B·C (혜승 요청 11-04) — 학생 목록·학생 카드·지원자 어디서든
const RANKS = ["S", "A", "B", "C"];
const RANK_COLOR = { S: "#b8860b", A: "#2b6cd8", B: "#2e8b57", C: "#8a8f98" };
const rankPill = (r) => (r ? `<span class="rk" style="background:${RANK_COLOR[r]}">${r}</span>` : "");
const rankChips = (s) => `<span class="rks">${RANKS.map((r) => `<button class="rkb ${s.rank === r ? "on" : ""}" data-rank="${r}" data-ruid="${s.id}" style="${s.rank === r ? `background:${RANK_COLOR[r]};border-color:${RANK_COLOR[r]};color:#fff` : ""}">${r}</button>`).join("")}</span>`;
function bindRank(after) {
  document.querySelectorAll("[data-rank]").forEach((b) => (b.onclick = async (e) => {
    e.stopPropagation();
    const uid = b.dataset.ruid, cur = DATA.students.find((x) => String(x.id) === uid)?.rank ?? (b.classList.contains("on") ? b.dataset.rank : null);
    const rank = cur === b.dataset.rank ? null : b.dataset.rank;
    try { haptic(); await api("rank", { uid, rank }); const st = DATA.students.find((x) => String(x.id) === uid); if (st) st.rank = rank; toast(rank ? `랭크 ${rank}` : "랭크 지웠어요"); after(); } catch (err) { toast("⚠️ " + err.message); }
  }));
  document.querySelectorAll("[data-rank]").forEach((b) => (b.onpointerdown = (e) => e.stopPropagation()));
}
const ago = (ts) => { if (!ts) return ""; const m = Math.round((Date.now() - ts) / 60000); return m < 60 ? `${m}분 전` : m < 1440 ? `${Math.round(m / 60)}시간 전` : `${Math.round(m / 1440)}일 전`; };
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const kst = (off) => { const d = new Date(Date.now() + 9 * 3600e3 + off * 864e5); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${WD[d.getUTCDay()]})`; };

let DATA = null;
let tab = "places";
let jobFilter = "open";
let stuQ = "", stuF = {};
const NEW = { kind: "urgent", off: 0, where: "g", topik: 0, car: false, gender: "", noFlaky: false, text: "", slots: "", cap: "", noInfo: 1, raw: false };
// 공고 양식 칸 (11-04 혜승: 누르고 빈칸에 타이핑) → 양식 글로 자동 조립
const DAYS = ["월", "화", "수", "목", "금", "토", "일"];
const F = { part: "", title: "", task: "", sex: "", count: "", addr: "", days: [], dates: [], startDate: "", wdS: "", wdE: "", weS: "", weE: "", wdPay: "", wePay: "", splitPay: false, payType: "", payDay: "" };
const F0 = JSON.stringify(F);
// 📷 이 공고에 붙일 사진·영상 (공고마다 따로 — 다른 업장과 안 섞임)
NEW.media = []; // { type, id, url? }
let POOL = 0; // 봇 대화로 보내 둔 것 (큰 영상 등) 개수
let UPLOADING = 0;
async function loadMedia() { try { POOL = ((await api("media")).items ?? []).length; } catch { POOL = 0; } }
const VIDEO_MAX = 4.3 * 1024 * 1024; // 미니앱으로 바로 올릴 수 있는 영상 크기 (Vercel 한도)
async function shrinkPhoto(file) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((ok) => c.toBlob((b) => ok(b ?? file), "image/jpeg", 0.85));
  } catch { return file; }
}
// 용량 초과 → 안내 후 봇 대화로 돌아감 (쓰던 공고는 그대로 기억, 다시 열면 새 공고 화면으로)
function tooBig(f) {
  saveDraft();
  const msg = `첨부 용량 초과 (${(f.size / 1048576).toFixed(1)}MB): 봇에게 메시지로 보내주세요.\n\n[확인] 봇 대화로 가기 · [취소] 이 화면에 그대로 있기\n봇 대화에 보낸 뒤 관리 화면을 다시 열고 [📥 봇 대화에서 가져오기]를 누르면 이 공고에 붙어요.`;
  const go = () => { try { localStorage.setItem("resumeNew", "1"); } catch {} tg?.close(); };
  if (tg?.showConfirm) tg.showConfirm(msg, (ok) => ok && go());
  else if (confirm(msg)) go();
}
async function uploadFiles(files) {
  for (const f of files) {
    const video = f.type.startsWith("video/");
    if (!video && !f.type.startsWith("image/")) continue;
    if (NEW.media.length >= 10) { toast("사진·영상은 10개까지예요"); break; }
    const body = video ? f : await shrinkPhoto(f);
    if (body.size > VIDEO_MAX) { tooBig(f); return; }
    UPLOADING++; renderNew();
    try {
      const r = await fetch("/api/upload", { method: "POST", headers: { "Content-Type": "application/octet-stream", "x-init-data": tg?.initData ?? "", "x-kind": video ? "video" : "photo" }, body });
      if (r.status === 413) { UPLOADING--; tooBig(f); return; }
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "올리기 실패");
      NEW.media.push({ ...j.item, url: URL.createObjectURL(f) });
    } catch (e) { toast("⚠️ " + e.message); }
    UPLOADING--; saveDraft(); renderNew();
  }
}
// 쓰던 공고 칸 기억 (봇 대화로 사진 보내러 나갔다 와도 그대로)
const DRAFT_KEY = "jobdraft";
const EDIT_KEY = "jobeditdraft"; // 공고 수정 중 용량 초과로 봇 대화에 다녀올 때
const saveDraft = () => { try {
  const media = NEW.media.map(({ type, id }) => ({ type, id }));
  if (NEW.editId) localStorage.setItem(EDIT_KEY, JSON.stringify({ editId: NEW.editId, kind: NEW.kind, raw: NEW.raw, text: NEW.text, slots: NEW.slots, cap: NEW.cap, F, media, at: Date.now() }));
  else localStorage.setItem(DRAFT_KEY, JSON.stringify({ F, kind: NEW.kind, cap: NEW.cap, placeId: NEW.placeId ?? null, media, at: Date.now() }));
} catch {} };
const clearDraft = () => { try { localStorage.removeItem(DRAFT_KEY); } catch {} };
// 새 공고 쓰던 것 불러오기 (수정을 마치거나 그만둘 때도 다시 불러옴)
function loadNewDraft() {
  NEW.media = []; NEW.cap = "";
  try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); if (d && Date.now() - d.at < 24 * 3600e3) { Object.assign(F, d.F); NEW.kind = d.kind ?? NEW.kind; NEW.cap = d.cap ?? ""; NEW.media = d.media ?? []; NEW.placeId = d.placeId ?? null; } } catch {}
}
loadNewDraft();
// 시간제 근무 날짜 (달력에서 여러 날 고름, "2026-11-05")
const todayISO = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const isoDay = (iso) => { const d = new Date(iso + "T00:00:00Z"); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${WD[d.getUTCDay()]})`; };
const isoOff = (iso) => Math.round((Date.parse(iso + "T00:00:00Z") - Date.parse(todayISO() + "T00:00:00Z")) / 864e5);
const won = (v) => { const n = String(v ?? "").replace(/[^\d]/g, ""); return n ? Number(n).toLocaleString("ko-KR") + "원" : ""; };
function composeJob() {
  const d = [...F.days].sort((a, b) => a - b);
  const wd = d.filter((x) => x < 5), we = d.filter((x) => x >= 5);
  const name = (xs) => xs.map((x) => DAYS[x] + "요일").join(" · ");
  const off = DAYS.map((_, i) => i).filter((i) => !d.includes(i));
  const time = (s, e) => (s || e ? `${s || "?"} ~ ${e || "?"}` : "");
  const L = [];
  L.push(`📢 [GIEC JOB] ${F.title.trim() || "(제목)"} 모집!`);
  if (F.task.trim()) L.push(`🧺 업무: ${F.task.trim()}`);
  if (F.count) L.push(`${F.sex === "여성" ? "👩" : F.sex === "남성" ? "👨" : "👥"} 모집인원: ${F.sex ? F.sex + " " : ""}${F.count}명`);
  if (F.addr.trim()) L.push("📍 근무 위치", F.addr.trim());
  L.push("━━━━━━━━━━━━━━", "⏰ 근무 조건");
  if (F.payType === "시간제") {
    const ds = [...(F.dates ?? [])].sort();
    if (ds.length) L.push(`📅 근무일: ${ds.map(isoDay).join(" · ")}${ds.length > 1 ? ` (총 ${ds.length}일)` : ""}`);
    if (time(F.wdS, F.wdE)) L.push(`🕘 근무시간: ${time(F.wdS, F.wdE)}`);
    L.push("━━━━━━━━━━━━━━", "💰 급여 조건");
    if (F.splitPay && F.wePay) { if (F.wdPay) L.push(`평일 시급: ${won(F.wdPay)}`); L.push(`주말 시급: ${won(F.wePay)}`); }
    else if (F.wdPay) L.push(`시급: ${won(F.wdPay)}`);
    L.push("급여 방식: 시간제");
    if (F.payDay.trim()) L.push(`급여 지급일: ${F.payDay.trim()}`);
    return L.join("\n");
  }
  if (d.length) { L.push(`📅 근무요일: 주 ${d.length}일`, name(d)); if (off.length) L.push(`휴무: ${name(off)}`); }
  if (wd.length && time(F.wdS, F.wdE)) L.push("🕘 평일 근무시간", `${name(wd)}: ${time(F.wdS, F.wdE)}`);
  if (we.length && time(F.weS, F.weE)) L.push("🕙 주말 근무시간", `${name(we)}: ${time(F.weS, F.weE)}`);
  if (!d.length && time(F.wdS, F.wdE)) L.push(`🕘 근무시간: ${time(F.wdS, F.wdE)}`);
  L.push("━━━━━━━━━━━━━━", "💰 급여 조건");
  if (F.payType === "월급제") { if (F.wdPay) L.push(`월급: ${won(F.wdPay)}`); }
  else if (F.splitPay && F.wePay) { if (F.wdPay) L.push(`평일 시급: ${won(F.wdPay)}`); L.push(`주말 시급: ${won(F.wePay)}`); }
  else if (F.wdPay) L.push(`시급: ${won(F.wdPay)}`);
  if (F.payType) L.push(`급여 방식: ${F.payType}`);
  if (F.payDay.trim()) L.push(`급여 지급일: ${F.payDay.trim()}`);
  return L.join("\n");
}

// ═════════════ 🏢 업장 → 공고 → 학생 (11-06 혜승 피드백 · 대표 결정) ═════════════
const placeOf = (j) => (j?.placeId ? (DATA.places ?? []).find((p) => p.id === j.placeId) ?? null : null);
const partName = (j) => j.form?.part || j.form?.title || j.title;
const hhmm = (min) => `${String(Math.floor(min / 60) % 24).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;
const tmin = (v) => { const m = /^(\d{1,2}):(\d{2})$/.exec(v || ""); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
const nowK = () => { const d = new Date(Date.now() + 9 * 3600e3); return { iso: d.toISOString().slice(0, 10), dow: (d.getUTCDay() + 6) % 7, min: d.getUTCHours() * 60 + d.getUTCMinutes() }; };
// 오늘 근무일인지 · 지금 근무시간 안인지 (공고 칸의 날짜·요일·시간으로)
function sched(j) {
  const f = j.form || {}, n = nowK();
  let today = false, s = null, e = null;
  if (f.payType === "시간제") { today = (f.dates || []).includes(n.iso); s = tmin(f.wdS); e = tmin(f.wdE); }
  else if (f.payType) {
    today = (f.days || []).includes(n.dow) && (!f.startDate || f.startDate <= n.iso);
    const we = n.dow >= 5;
    s = tmin(we ? f.weS || f.wdS : f.wdS || f.weS); e = tmin(we ? f.weE || f.wdE : f.wdE || f.weE);
  } else { today = j.date === n.iso; s = j.startMin; e = s != null ? s + 480 : null; }
  const inWin = s != null && e != null && (e > s ? n.min >= s && n.min < e : n.min >= s || n.min < e);
  return { today, now: today && inWin };
}
const workingN = (j) => (sched(j).now ? Math.max(0, (j.placed?.length ?? 0) - (j.placedNo ?? 0)) : 0);
const todayN = (j) => (sched(j).today ? j.placed?.length ?? 0 : 0);
function whenLabel(j) {
  const f = j.form || {};
  if (f.payType === "시간제") return f.dates?.length ? [...f.dates].sort().map(isoDay).join(" · ") : "날짜 미정";
  if (f.payType) return [f.days?.length ? [...f.days].sort((a, b) => a - b).map((i) => DAYS[i]).join("·") : null, f.startDate ? `${isoDay(f.startDate)}부터` : null].filter(Boolean).join(" · ") || "요일 미정";
  return j.dateLabel || "날짜 없음";
}
function timeLabel(j) {
  const f = j.form || {};
  const t = (a, b) => (a || b ? `${a || "?"}–${b || "?"}` : "");
  if (!f.payType) return j.startMin != null ? `${hhmm(j.startMin)} 시작` : "";
  const out = [t(f.wdS, f.wdE)];
  if (f.payType !== "시간제" && (f.days || []).some((x) => x >= 5) && t(f.weS, f.weE) && t(f.weS, f.weE) !== t(f.wdS, f.wdE)) out.push(`주말 ${t(f.weS, f.weE)}`);
  return out.filter(Boolean).join(" · ");
}
function payLabel(j) {
  const f = j.form || {};
  if (!f.payType) return "";
  if (f.payType === "월급제") return f.wdPay ? `월급 ${won(f.wdPay)}` : "월급제";
  return [f.wdPay ? `시급 ${won(f.wdPay)}` : null, f.splitPay && f.wePay ? `주말 ${won(f.wePay)}` : null, f.payType].filter(Boolean).join(" · ");
}

}

// 👥 지금 근무 중 / 배치 기다림 — 학생 카드(지원자·배치 칸과 같은 정보) + 어느 업장인지

    else if (!j.closed) uids = (j.apps ?? []).filter((u) => !(j.placed ?? []).includes(u));
    for (const u of uids) { if (!map.has(u)) map.set(u, []); map.get(u).push(j); }
  }
  return [...map.entries()].map(([uid, jobs]) => ({ s: DATA.students.find((x) => Number(x.id) === uid) ?? { id: uid, name: `#${uid}`, guest: true, workOk: 0, workNo: 0, days: [] }, jobs }));

  document.querySelectorAll("[data-unapply]").forEach((b) => (b.onclick = () => confirmDo("이 지원을 취소하고 자리를 다시 열까요?", () => act(() => api("unapply", { id, uid: b.dataset.unapply }), "↩️ 취소했어요"))));

const stuSel = new Set();
let stuPick = false; // ☑ 골라서 지우기 모드
const confirmDo = (msg, fn) => (tg?.showConfirm ? tg.showConfirm(msg, (ok) => ok && fn()) : confirm(msg) && fn());
async function delStudents(ids) {
  try { haptic(); const r = await api("del", { uids: ids }); ids.forEach((i) => stuSel.delete(String(i))); toast(`🗑 ${r.n}명 지웠어요`); await load(); return true; } catch (e) { toast("⚠️ " + e.message); return false; }
}
function renderStudents() {
  const q = stuQ.trim().toLowerCase();
  let list = DATA.students.filter((s) => !q || [s.name, s.school, s.phone, s.tgName, s.username].some((v) => String(v ?? "").toLowerCase().includes(q)));

  if (stuF.t3) list = list.filter((s) => s.topikN >= 2);
  if (stuF.car) list = list.filter((s) => s.car);
  if (stuF.star) list = list.filter((s) => badge(s) === "⭐");
  if (stuF.flaky) list = list.filter((s) => s.workNo >= 2);
  if (stuF.newOnly) list = list.filter((s) => s.status === "new");
  if (stuF.rank) list = list.filter((s) => s.rank === stuF.rank);
  const chip = (k, n) => `<button class="chip ${stuF[k] ? "on" : ""}" data-sf="${k}">${n}</button>`;

    <div class="chips"><span class="muted" style="align-self:center;font-size:13px">랭크</span>${RANKS.map((r) => `<button class="chip ${stuF.rank === r ? "on" : ""}" data-rf="${r}">${r}</button>`).join("")}</div>
    <div class="row" style="margin:0 2px 8px;flex-wrap:wrap"><span class="muted sp">${list.length}명${stuPick ? ` · <b>${stuSel.size}명 고름</b>` : ""}</span>
      ${stuPick
        ? `<button class="btn ghost sm" id="selAll">${list.length && list.every((s) => stuSel.has(String(s.id))) ? "모두 풀기" : "모두 선택"}</button>`

  });
}

let countTimer = null;
// 📅 작은 달력 팝업 (시간제 근무 날짜 여러 개 고르기)
function calHtml() {
  const [y, m] = NEW.calM.split("-").map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
  const n = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const today = todayISO();
  const cells = Array(first).fill("").concat([...Array(n)].map((_, i) => `${NEW.calM}-${String(i + 1).padStart(2, "0")}`));
  const cell = (iso) => {
    if (!iso) return "<span></span>";
    const past = iso < today, on = NEW.calMode === "start" ? F.startDate === iso : F.dates.includes(iso);
    return `<button class="chip ${on ? "on" : ""}" data-cd="${iso}" ${past ? "disabled" : ""} style="margin:0;padding:8px 0;min-width:0;${past ? "opacity:.3" : ""}${iso === today && !on ? ";border:1.5px solid var(--btn)" : ""}">${Number(iso.slice(8))}</button>`;
  };
  return `<div style="position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:50">
    <div class="card" style="width:100%;max-width:420px;margin:0;border-radius:16px 16px 0 0;padding:14px 14px 20px">
      <div class="row"><button class="btn ghost sm" data-cm="-1" type="button" aria-label="이전 달">‹</button><b class="sp" style="text-align:center">${y}년 ${m}월</b><button class="btn ghost sm" data-cm="1" type="button" aria-label="다음 달">›</button></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center">
        ${WD.map((w) => `<span class="muted" style="font-size:12px">${w}</span>`).join("")}${cells.map(cell).join("")}
      </div>
      ${NEW.calMode === "start"
        ? `<div class="muted" style="margin-top:10px">${F.startDate ? `첫 출근일: ${isoDay(F.startDate)}` : "첫 출근일을 눌러 고르세요"}</div>
      <div class="btns" style="margin-top:10px"><button class="btn ghost" id="calClear" type="button">날짜 상관없음</button><button class="btn" id="calDone" type="button" style="flex:1">완료</button></div>`
        : `<div class="muted" style="margin-top:10px">${F.dates.length ? `${F.dates.length}일 고름: ${[...F.dates].sort().map(isoDay).join(" · ")}` : "날짜를 눌러 고르세요 (여러 날 가능)"}</div>
      <div class="btns" style="margin-top:10px"><button class="btn ghost" id="calClear" type="button">모두 풀기</button><button class="btn" id="calDone" type="button" style="flex:1">완료</button></div>`}
    </div></div>`;
}
// 🕘 시간 칸 (혜승 요청 11-04): [오전/오후] 누를 때마다 바뀜 · 시·분은 타이핑도 되고 ▾ 누르면 목록(분은 00부터)
const tpParse = (v) => { const m = /^(\d{1,2}):(\d{2})$/.exec(v || ""); if (!m) return { pm: false, h: "", m: "" }; const H = Number(m[1]); return { pm: H >= 12, h: String(H % 12 === 0 ? 12 : H % 12), m: m[2] }; };
const tpSet = (key, pm, h, m) => {
  let H = Number(h); if (!h || !H || H > 24) { F[key] = ""; return; }
  if (H > 12) { pm = true; H -= 12; }

  document.querySelectorAll("[data-cd]").forEach((b) => (b.onclick = () => {
    const v = b.dataset.cd;
    if (NEW.calMode === "start") { F.startDate = F.startDate === v ? "" : v; NEW.calOpen = false; }
    else F.dates = F.dates.includes(v) ? F.dates.filter((x) => x !== v) : [...F.dates, v];
    renderNew();
  }));
  document.querySelectorAll("[data-cm]").forEach((b) => (b.onclick = () => { const [y, m] = NEW.calM.split("-").map(Number); const d = new Date(Date.UTC(y, m - 1 + Number(b.dataset.cm), 1)); NEW.calM = d.toISOString().slice(0, 7); renderNew(); }));
  $("#calDone") && ($("#calDone").onclick = () => { NEW.calOpen = false; renderNew(); });
  $("#calClear") && ($("#calClear").onclick = () => { if (NEW.calMode === "start") { F.startDate = ""; NEW.calOpen = false; } else F.dates = []; renderNew(); });
  document.querySelectorAll("[data-pt]").forEach((b) => (b.onclick = () => {
    if (F.payType === "월급제" || b.dataset.pt === "월급제") F.wePay = "";
    if (F.payType && (F.payType === "월급제") !== (b.dataset.pt === "월급제")) F.wdPay = ""; // 월급 ↔ 시급 바꾸면 금액 비움
    F.payType = b.dataset.pt;
    renderNew();
  }));
  if (!F.payType && !NEW.raw) {
    $("#send").disabled = true;
    $("#past0").onclick = () => { F.payType = "시간제"; NEW.pastOpen = true; renderNew(); };
  } else if (NEW.raw) {
    $("#text").oninput = () => { sync(); const m = (/(\d{1,3})\s*명/.exec(NEW.text) || [])[1]; $("#slots").placeholder = m ?? "비우면 인원 안 셈"; };
    $("#slots").oninput = sync;
    $("#cap").oninput = () => (NEW.cap = $("#cap").value.replace(/\D/g, ""));
    $("#toForm").onclick = () => { if (!confirm("칸 채우기로 돌아가면 직접 고친 글은 사라져요. 돌아갈까요?")) return; NEW.raw = false; renderNew(); };
  } else {
    $("#send").disabled = false;
    $("#capF") && ($("#capF").oninput = () => (NEW.cap = $("#capF").value.replace(/\D/g, "")));
    document.querySelectorAll("[data-f]").forEach((el) => (el.oninput = () => { F[el.dataset.f] = el.value; $("#pv").textContent = composeJob(); saveDraft(); }));
    document.querySelectorAll("[data-day]").forEach((b) => (b.onclick = () => { const i = Number(b.dataset.day); F.days = F.days.includes(i) ? F.days.filter((x) => x !== i) : [...F.days, i]; renderNew(); }));
    document.querySelectorAll("[data-sex]").forEach((b) => (b.onclick = () => { F.sex = b.dataset.sex; renderNew(); }));

    $("#past").onclick = () => { NEW.pastOpen = !NEW.pastOpen; renderNew(); };
    document.querySelectorAll("[data-past]").forEach((b) => (b.onclick = () => {
      const j = DATA.jobs.find((x) => String(x.id) === b.dataset.past); if (!j) return;
      NEW.pastOpen = false;
      if (j.media?.length) NEW.media = j.media.map(({ type, id }) => ({ type, id }));
      if (j.form) { Object.assign(F, JSON.parse(JSON.stringify(j.form)), { dates: [], startDate: "" }); if (F.wePay) F.splitPay = true; /* 날짜는 매번 새로 고름 */ toast(`#${j.id} 불러왔어요 — 날짜·인원만 확인하세요`); }
      else { NEW.text = j.text; NEW.slots = ""; NEW.raw = true; toast(`#${j.id} 글을 불러왔어요 (예전 공고라 글로 고쳐요)`); }
      renderNew();
    }));
    $("#toRaw").onclick = () => { NEW.text = composeJob(); NEW.slots = F.count ? String(F.count) : ""; NEW.raw = true; renderNew(); };
  }
  document.querySelectorAll("[data-n]").forEach((b) => (b.onclick = () => { sync(); const k = b.dataset.n; const v = b.dataset.v; NEW[k] = v === "" ? (k === "off" ? null : "") : isNaN(Number(v)) ? v : Number(v); renderNew(); }));
  $("#car") && ($("#car").onclick = () => { sync(); NEW.car = !NEW.car; renderNew(); });
  $("#nf") && ($("#nf").onclick = () => { sync(); NEW.noFlaky = !NEW.noFlaky; renderNew(); });
  if (NEW.where !== "g") {
    clearTimeout(countTimer);
    countTimer = setTimeout(async () => {
      try {
        const r = await api("count", { filter: { off: !NEW.raw && F.payType === "시간제" ? (F.dates.length ? isoOff([...F.dates].sort()[0]) : null) : !NEW.raw && F.payType ? (F.startDate ? isoOff(F.startDate) : null) : NEW.off, topik: NEW.topik, car: NEW.car, gender: NEW.gender, noFlaky: NEW.noFlaky } });
        const el = $("#cnt"); if (!el) return;
        el.innerHTML = `📩 맞는 학생 <b>${r.count}명</b>${r.count ? `<div class="muted" style="margin-top:4px">${r.sample.slice(0, 12).map((s) => `${badge(s)}${esc(s.name)}`).join(", ")}${r.count > 12 ? " …" : ""}</div>` : ""}`;
      } catch (e) { const el = $("#cnt"); if (el) el.textContent = "⚠️ " + e.message; }
    }, 250);
  }
  $("#send").onclick = () => {
    sync();
    if (!NEW.raw && F.payType === "시간제") {
      if (!F.dates.length) return toast("근무 날짜를 골라 주세요");
      NEW.off = isoOff([...F.dates].sort()[0]); // 첫 근무일 = 출근 확인·1:1 학생 고르기 기준
    } else if (!NEW.raw && F.payType) NEW.off = F.startDate ? isoOff(F.startDate) : null; // 주급·월급제 첫 출근일
    if (!NEW.raw && !F.title.trim()) return toast("제목을 써 주세요");
    if (UPLOADING) return toast("⏳ 사진·영상 올리는 중이에요. 잠깐만요");
    if (!NEW.text.trim()) return toast("공고 내용을 써 주세요");
    if (NEW.cap && NEW.slots && Number(NEW.cap) < Number(NEW.slots)) return toast("지원서 정원은 모집인원보다 같거나 많아야 해요");
    if (NEW.editId) {
      const id = NEW.editId;
      const before = JSON.stringify((DATA.jobs.find((x) => x.id === id)?.media ?? []).map((m) => m.id));
      const mediaMoved = !NEW.noMedia && before !== JSON.stringify(NEW.media.map((m) => m.id));
      return confirmDo(mediaMoved ? `공고 #${id}를 고칠까요?\n사진·영상이 바뀌어서 채널 공고를 새 글로 다시 올리고, 예전 글은 지워요.` : `공고 #${id}를 이 내용으로 고칠까요? 채널 공고 글도 바뀌어요.`, async () => {
        const btn = $("#send"); btn.disabled = true; btn.textContent = "저장 중…";
        try {
          await api("editJob", { id, text: NEW.text, slots: NEW.slots || null, cap: NEW.cap || null, form: NEW.raw ? null : { ...F }, media: NEW.noMedia ? undefined : NEW.media.map(({ type, id }) => ({ type, id })) });
          toast("💾 공고를 고쳤어요");
          endEdit();
          await load(); tab = "places"; location.hash = `job=${id}`;
        } catch (e) { toast("⚠️ " + e.message); btn.disabled = false; btn.textContent = "💾 수정 저장"; }
      });
    }
    const where = { g: "그룹방(채널)에 올릴까요?", d: "맞는 학생에게 1:1로 보낼까요?", b: "그룹방에 올리고 1:1로도 보낼까요?" }[NEW.where];
    const go = async () => {
      const btn = $("#send"); btn.disabled = true; btn.textContent = "보내는 중…";
      try {
        const r = await api("send", { text: NEW.text, kind: NEW.kind, off: NEW.off, slots: NEW.slots || null, cap: NEW.cap || null, media: NEW.media.map(({ type, id }) => ({ type, id })), where: NEW.where, placeId: NEW.placeId ?? null, form: NEW.raw ? null : { ...F }, filter: { topik: NEW.topik, car: NEW.car, gender: NEW.gender, noFlaky: NEW.noFlaky } });
        toast(`✅ 공고 #${r.id} — ${r.out.join(" · ")}`);
        Object.assign(NEW, { text: "", slots: "", cap: "", raw: false });
        NEW.media = []; NEW.placeId = null; clearDraft();
        Object.assign(F, JSON.parse(F0));
        await load(); tab = "places"; location.hash = `job=${r.id}`;
      } catch (e) { toast("⚠️ " + e.message); btn.disabled = false; btn.textContent = "보내기"; }
    };
    tg?.showConfirm ? tg.showConfirm(where, (ok) => ok && go()) : go();
  };
}

(async () => {
  if (!(await load())) return;
  let resume = false;
  try { resume = localStorage.getItem("resumeNew") === "1"; localStorage.removeItem("resumeNew"); } catch {}
  let ed = null;
  try { ed = JSON.parse(localStorage.getItem(EDIT_KEY) || "null"); } catch {}
  if (resume && ed && Date.now() - ed.at < 24 * 3600e3 && DATA.jobs.some((x) => x.id === ed.editId)) { // 공고 수정 중이었으면 수정 화면 그대로
    Object.assign(F, JSON.parse(F0), ed.F);
    Object.assign(NEW, { editId: ed.editId, kind: ed.kind, raw: ed.raw, text: ed.text, slots: ed.slots, cap: ed.cap, media: ed.media ?? [], noMedia: false, pastOpen: false, calOpen: false, tp: null });
    setTab("new");
  } else if (resume && !location.hash) setTab("new"); // 용량 초과로 봇 대화에 다녀옴 → 쓰던 새 공고 화면으로
  else render();
})();
document.addEventListener("visibilitychange", async () => { if (!document.hidden && DATA) { await load(); render(); } });
</script>
</body>
</html>
